<?xml version="1.0" encoding="UTF-8"?>
<!-- 人样 favicon：深色底上的单色人形身体与品牌色头部，专为 16px 和 32px 收紧比例。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="renyang-favicon-title renyang-favicon-desc">
  <title id="renyang-favicon-title">人样</title>
  <desc id="renyang-favicon-desc">深色圆角方形中的简洁人物标志。</desc>
  <rect width="32" height="32" rx="7" fill="#20262c"/>
  <!-- 小尺寸版本统一身体颜色，避免两色笔画在 16px 下产生断裂感。 -->
  <circle cx="16" cy="8" r="3" fill="#c9695e"/>
  <path d="M14 14 7.5 24.5M18 14l6.5 10.5" fill="none" stroke="#f7f4ee" stroke-width="5.2" stroke-linecap="round"/>
</svg>
