<?xml version="1.0" encoding="UTF-8"?>
<!-- 人样实体图形精灵：八个核心对象共用 24×24 网格、1.6px 描边和圆端连接。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 404 196" role="img" aria-labelledby="entity-glyphs-title">
  <title id="entity-glyphs-title">人样核心实体图形</title>
  <defs>
    <symbol id="entity-persona" viewBox="0 0 24 24">
      <circle cx="10" cy="8" r="3"/>
      <path d="M4.5 19c.7-3.5 2.6-5.4 5.5-5.4s4.8 1.9 5.5 5.4M18 4h2v16h-2M18 8h2"/>
    </symbol>
    <symbol id="entity-world" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5"/>
      <path d="M3.8 10h4l2-3 3 1 1.5 3.2 3.7.8 1.5 3M8.2 19.3l1.3-4.3 3-1.2 2.4 1.7-.8 4.4M12 3.5c-2.1 2.1-3.2 4.9-3.2 8.5s1.1 6.4 3.2 8.5"/>
    </symbol>
    <symbol id="entity-source" viewBox="0 0 24 24">
      <path d="M6 3.5h8l4 4V20H6zM14 3.5V8h4M9 12h6M9 15.5h6"/>
      <path d="M9 3.5v-1h8l4 4V17h-3"/>
