    <symbol id="entity-template" viewBox="0 0 24 24">
      <path d="M7 3.5h11v15H7zM4 6.5h3M4 6.5v14h11v-2M10 8h5M10 12h5M10 15h3"/>
    </symbol>
    <symbol id="entity-settings" viewBox="0 0 24 24">
      <path d="M4 6h5M13 6h7M4 12h10M18 12h2M4 18h3M11 18h9"/>
      <circle cx="11" cy="6" r="2"/>
      <circle cx="16" cy="12" r="2"/>
      <circle cx="9" cy="18" r="2"/>
    </symbol>
  </defs>
  <rect width="404" height="196" rx="18" fill="#f6f5f1"/>
  <g fill="#ffffff" stroke="#ddd9d1">
    <rect x="12" y="12" width="86" height="80" rx="10"/>
    <rect x="110" y="12" width="86" height="80" rx="10"/>
    <rect x="208" y="12" width="86" height="80" rx="10"/>
    <rect x="306" y="12" width="86" height="80" rx="10"/>
    <rect x="12" y="104" width="86" height="80" rx="10"/>
    <rect x="110" y="104" width="86" height="80" rx="10"/>
    <rect x="208" y="104" width="86" height="80" rx="10"/>
    <rect x="306" y="104" width="86" height="80" rx="10"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" color="#20262c">
    <svg x="35" y="24" width="40" height="40"><use href="#entity-persona"/></svg>
    <svg x="133" y="24" width="40" height="40"><use href="#entity-world"/></svg>
    <svg x="231" y="24" width="40" height="40"><use href="#entity-source"/></svg>
    <svg x="329" y="24" width="40" height="40"><use href="#entity-task"/></svg>
    <svg x="35" y="116" width="40" height="40"><use href="#entity-feedback"/></svg>
    <svg x="133" y="116" width="40" height="40"><use href="#entity-evaluation"/></svg>
    <svg x="231" y="116" width="40" height="40"><use href="#entity-template"/></svg>
    <svg x="329" y="116" width="40" height="40"><use href="#entity-settings"/></svg>
  </g>
  <g fill="#59616a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif" font-size="11" text-anchor="middle">
    <text x="55" y="81">人物</text><text x="153" y="81">世界</text><text x="251" y="81">资料</text><text x="349" y="81">任务</text>
    <text x="55" y="173">反馈</text><text x="153" y="173">评测</text><text x="251" y="173">模板</text><text x="349" y="173">生成设置</text>
