<?xml version="1.0" encoding="UTF-8"?>
<!-- 人样状态符号精灵：状态同时依赖形状与文字，颜色只作为辅助语义。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 104" role="img" aria-labelledby="status-symbols-title">
  <title id="status-symbols-title">人样状态符号</title>
  <defs>
    <symbol id="status-complete" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8" fill="currentColor" stroke="none"/>
      <path d="m8.5 12 2.3 2.4 4.8-5" fill="none" stroke="#fff" stroke-width="1.8"/>
    </symbol>
    <symbol id="status-progress" viewBox="0 0 24 24">
      <path d="M18.2 17.3A8 8 0 1 1 19.6 9" fill="none"/>
      <path d="M19.6 5v4h-4" fill="none"/>
    </symbol>
    <symbol id="status-pending" viewBox="0 0 24 24">
      <path d="m12 3.5 8.5 8.5-8.5 8.5L3.5 12z" fill="none"/>
      <circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="status-warning" viewBox="0 0 24 24">
      <path d="M12 3.8 21 20H3z" fill="none"/>
      <path d="M12 9v5M12 17.2v.1" fill="none"/>
    </symbol>
    <symbol id="status-failed" viewBox="0 0 24 24">
      <path d="m8 3.5 8 0 4.5 4.5v8L16 20.5H8L3.5 16V8z" fill="none"/>
      <path d="m9 9 6 6M15 9l-6 6" fill="none"/>
    </symbol>
    <symbol id="status-candidate" viewBox="0 0 24 24">
      <rect x="4" y="4" width="13" height="13" rx="1.5" fill="none"/>
      <rect x="7" y="7" width="13" height="13" rx="1.5" fill="none"/>
    </symbol>
    <symbol id="status-locked" viewBox="0 0 24 24">
      <rect x="5" y="10" width="14" height="10" rx="2" fill="none"/>
      <path d="M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10M12 14v2" fill="none"/>
    </symbol>
  </defs>
  <rect width="494" height="104" rx="16" fill="#f6f5f1"/>
  <g fill="#fff" stroke="#ddd9d1">
    <rect x="10" y="10" width="60" height="84" rx="10"/><rect x="79" y="10" width="60" height="84" rx="10"/>
    <rect x="148" y="10" width="60" height="84" rx="10"/><rect x="217" y="10" width="60" height="84" rx="10"/>
    <rect x="286" y="10" width="60" height="84" rx="10"/><rect x="355" y="10" width="60" height="84" rx="10"/>
    <rect x="424" y="10" width="60" height="84" rx="10"/>
  </g>
  <g stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <svg x="26" y="22" width="28" height="28" color="#3d7a56" stroke="currentColor"><use href="#status-complete"/></svg>
    <svg x="95" y="22" width="28" height="28" color="#9a6a21" stroke="currentColor"><use href="#status-progress"/></svg>
    <svg x="164" y="22" width="28" height="28" color="#795e8e" stroke="currentColor"><use href="#status-pending"/></svg>
    <svg x="233" y="22" width="28" height="28" color="#9a6a21" stroke="currentColor"><use href="#status-warning"/></svg>
    <svg x="302" y="22" width="28" height="28" color="#a33f3f" stroke="currentColor"><use href="#status-failed"/></svg>
    <svg x="371" y="22" width="28" height="28" color="#4b6f89" stroke="currentColor"><use href="#status-candidate"/></svg>
    <svg x="440" y="22" width="28" height="28" color="#37424c" stroke="currentColor"><use href="#status-locked"/></svg>
  </g>
  <g fill="#59616a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif" font-size="10" text-anchor="middle">
    <text x="40" y="78">已完成</text><text x="109" y="78">进行中</text><text x="178" y="78">待确认</text><text x="247" y="78">警告</text>
    <text x="316" y="78">失败</text><text x="385" y="78">候选</text><text x="454" y="78">已锁定</text>
  </g>
</svg>
